name: CIFuzz
on:
  push:
    branches:
      - master
      - smoke/*
      - fuzz/*
    tags:
      - '0.*.*'
      - '0.*'
  pull_request:
    branches:
      - '*'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      id: build
      # NOTE curl -s https://api.github.com/repos/google/oss-fuzz/commits/master | jq -r '.sha'
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@fc414cad2ab6f5d2fedeb83169c6a85ca285a8c4
      with:
        oss-fuzz-project-name: 'libredwg'
        dry-run: false
        language: c
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@fc414cad2ab6f5d2fedeb83169c6a85ca285a8c4
      with:
        oss-fuzz-project-name: 'libredwg'
        fuzz-seconds: 300
        dry-run: false
        language: c
    - name: Upload Crash
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: ./out/artifacts
