name: ODA
on:
  push:
    branches:
      - master
      - smoke/*
      - work/oda

# cancel older workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oda:
    runs-on: ubuntu-22.04
    #runs-on: self-hosted
    timeout-minutes: 50
    strategy:
      fail-fast: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    - name: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
    - uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
      # see version at https://www.opendesign.com/guestfiles/oda_file_converter
    - run: |
        wget -q -O oda.html https://www.opendesign.com/guestfiles/oda_file_converter
        #deb=ODAFileConverter_QT6_lnxX64_8.3dll_27.1.deb
        deb="$(perl -lne'/(ODAFileConverter_QT6_lnxX64.*\.deb)/ && print $1' oda.html)"
        wget -q -O $deb https://www.opendesign.com/guestfiles/get?filename=$deb
        sudo apt update
        sudo apt-get -y install qt5dxcb-plugin
        sudo dpkg -i $deb
        cd /usr/lib/x86_64-linux-gnu
        sudo ln -s libxcb-util.so.1 libxcb-util.so.0
    - run: |
        export QT_DEBUG_PLUGINS=1
        ODAFileConverter test/test-data . ACAD2000 DXF 0 0 example_2000.dwg || true
        test -f example_2000.dxf || (cat example_2000.dxf.err; exit 1)
        echo ODAFileConverter works ok
        export QT_DEBUG_PLUGINS=
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        create-symlink: true
        key: ${{ github.job }}
    - run: sh autogen.sh
    - run: CFLAGS=-O0 ./configure --disable-bindings
    - run: make -j
    - run: make -j check -C programs TESTS="dxf.test json.test"
      # this makes it green, but we want it red
      #continue-on-error: true
