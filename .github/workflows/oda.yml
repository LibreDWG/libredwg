name: ODA
on:
  push:
    branches:
      - master
      - smoke/*
      - work/oda

# cancel older workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oda:
    runs-on: ubuntu-22.04
    #runs-on: self-hosted
    timeout-minutes: 50
    strategy:
      fail-fast: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        submodules: recursive
    - name: setup-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.10'
    - uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0
      # see version at https://www.opendesign.com/guestfiles/oda_file_converter
    - run: |
        wget -q -O oda.html https://www.opendesign.com/guestfiles/oda_file_converter
        #deb=ODAFileConverter_QT6_lnxX64_8.3dll_27.1.deb
        deb="$(perl -lne'/(ODAFileConverter_QT6_lnxX64[^{\s"<>]*\.deb)/ && print $1' oda.html | head -1)"
        wget -q -O $deb https://www.opendesign.com/guestfiles/get?filename=$deb
        sudo apt update
        sudo apt-get -y install qt5dxcb-plugin libopengl0 libxcb-cursor0
        sudo dpkg -i $deb
        cd /usr/lib/x86_64-linux-gnu
        sudo ln -s libxcb-util.so.1 libxcb-util.so.0
    - run: |
        export QT_DEBUG_PLUGINS=1
        ODAFileConverter test/test-data . ACAD2000 DXF 0 0 example_2000.dwg || true
        test -f example_2000.dxf || (cat example_2000.dxf.err; exit 1)
        echo ODAFileConverter works ok
        export QT_DEBUG_PLUGINS=
    - uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
      with:
        create-symlink: true
        key: ${{ github.job }}
    - run: sh autogen.sh
    - run: CFLAGS=-O0 ./configure --disable-bindings
    - run: make -j
    - run: make -j check -C programs TESTS="dxf.test json.test"
      # this makes it green, but we want it red
      #continue-on-error: true
